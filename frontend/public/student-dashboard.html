<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطالب - TauTec</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 280px;
            background: var(--dark-card);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            text-align: center;
        }

        .user-info {
            background: rgba(99, 102, 241, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 10px;
        }

        .user-name {
            text-align: center;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .user-role {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: var(--text);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .nav-icon {
            font-size: 20px;
        }

        /* Main Content */
        .main-content {
            margin-right: 280px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--dark-card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.2);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stat-icon.blue { background: rgba(99, 102, 241, 0.2); color: #6366f1; }
        .stat-icon.green { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .stat-icon.orange { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .stat-icon.purple { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Course Cards */
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .course-card {
            background: var(--dark-card);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .course-thumbnail {
            width: 100%;
            height: 180px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .course-content {
            padding: 20px;
        }

        .course-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .course-instructor {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient);
            border-radius: 10px;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
            }
            .main-content {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">🎓 TauTec</div>
        
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-name" id="userName">جاري التحميل...</div>
            <div class="user-role">طالب</div>
        </div>

        <nav>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <span class="nav-icon">📊</span>
                        <span>الرئيسية</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#courses" class="nav-link">
                        <span class="nav-icon">📚</span>
                        <span>دوراتي</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#assignments" class="nav-link">
                        <span class="nav-icon">📝</span>
                        <span>الواجبات</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#messages" class="nav-link">
                        <span class="nav-icon">💬</span>
                        <span>الرسائل</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#profile" class="nav-link">
                        <span class="nav-icon">⚙️</span>
                        <span>الإعدادات</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="logout()">
                        <span class="nav-icon">🚪</span>
                        <span>تسجيل الخروج</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <h1>مرحباً بك، <span id="headerName">الطالب</span>! 👋</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="window.location.href='/courses.html'">
                    تصفح الدورات
                </button>
            </div>
        </header>

        <!-- Stats Cards -->
        <section class="stats-grid" id="statsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل الإحصائيات...</p>
            </div>
        </section>

        <!-- Enrolled Courses -->
        <section>
            <h2 class="section-title">دوراتي الحالية</h2>
            <div class="courses-grid" id="coursesGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>جاري تحميل الدورات...</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        // Check authentication
        if (!token || user.role !== 'student') {
            window.location.href = '/login.html';
        }

        // Set user info
        document.getElementById('userName').textContent = `${user.first_name} ${user.last_name}`;
        document.getElementById('headerName').textContent = user.first_name;
        document.getElementById('userAvatar').textContent = user.first_name.charAt(0);

        // Fetch dashboard stats
        async function fetchStats() {
            try {
                const response = await fetch(`${API_URL}/student/dashboard/stats`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    const stats = data.data;
                    document.getElementById('statsGrid').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-icon blue">📚</div>
                            <div class="stat-value">${stats.enrolledCourses}</div>
                            <div class="stat-label">دورات نشطة</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green">✅</div>
                            <div class="stat-value">${stats.completedCourses}</div>
                            <div class="stat-label">دورات مكتملة</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon orange">📝</div>
                            <div class="stat-value">${stats.pendingAssignments}</div>
                            <div class="stat-label">واجبات معلقة</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon purple">⏱️</div>
                            <div class="stat-value">${Math.floor(stats.totalLearningTime / 3600)}h</div>
                            <div class="stat-label">ساعات التعلم</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Fetch stats error:', error);
                document.getElementById('statsGrid').innerHTML = `
                    <p style="text-align: center; color: var(--text-muted);">
                        حدث خطأ في تحميل الإحصائيات
                    </p>
                `;
            }
        }

        // Fetch enrolled courses
        async function fetchCourses() {
            try {
                const response = await fetch(`${API_URL}/student/enrolled-courses`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    document.getElementById('coursesGrid').innerHTML = data.data.map(course => `
                        <div class="course-card" onclick="window.location.href='/course-view.html?id=${course.id}'">
                            <div class="course-thumbnail">📖</div>
                            <div class="course-content">
                                <div class="course-title">${course.title}</div>
                                <div class="course-instructor">👨‍🏫 ${course.instructor_first_name} ${course.instructor_last_name}</div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${course.progress}%"></div>
                                </div>
                                <div class="progress-text">${course.progress.toFixed(0)}% مكتمل</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('coursesGrid').innerHTML = `
                        <div style="text-align: center; grid-column: 1/-1; padding: 40px;">
                            <p style="font-size: 48px; margin-bottom: 20px;">📚</p>
                            <p style="color: var(--text-muted); margin-bottom: 20px;">لم تسجل في أي دورة بعد</p>
                            <button class="btn btn-primary" onclick="window.location.href='/courses.html'">
                                تصفح الدورات
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Fetch courses error:', error);
                document.getElementById('coursesGrid').innerHTML = `
                    <p style="text-align: center; color: var(--text-muted);">
                        حدث خطأ في تحميل الدورات
                    </p>
                `;
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // Load data
        fetchStats();
        fetchCourses();
    </script>
</body>
</html>
