<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - TauTec</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --dark: #0f172a;
            --dark-card: #1e293b;
            --text: #f1f5f9;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--text);
        }
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 280px;
            background: var(--dark-card);
            padding: 30px 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 40px;
        }
        .main-content {
            margin-right: 280px;
            padding: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--dark-card);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">🎓 TauTec</div>
    </aside>

    <main class="main-content">
        <h1>لوحة تحكم المدير ⚙️</h1>
        <section class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">0</div>
                <div>المستخدمين</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalCourses">0</div>
                <div>الدورات</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalProjects">0</div>
                <div>المشاريع</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeEnrollments">0</div>
                <div>التسجيلات النشطة</div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token || user.role !== 'admin') {
            window.location.href = '/login.html';
        }

        async function loadStats() {
            const res = await fetch(`${API_URL}/admin/dashboard/stats`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                const users = Object.values(data.data.users).reduce((a, b) => a + b, 0);
                document.getElementById('totalUsers').textContent = users;
                document.getElementById('totalCourses').textContent = data.data.totalCourses;
                document.getElementById('totalProjects').textContent = data.data.totalProjects;
                document.getElementById('activeEnrollments').textContent = data.data.activeEnrollments;
            }
        }

        loadStats();
    </script>
</body>
</html>
