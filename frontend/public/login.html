<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tau Tec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00bcd4;
            --primary-dark: #0097a7;
            --primary-light: #4dd0e1;
            --light: #ffffff;
            --light-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --gradient-cyan: linear-gradient(135deg, #00bcd4 0%, #0097a7 100%);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #e0f7fa 0%, #ffffff 50%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.2), rgba(0, 151, 167, 0.2));
            animation: float 20s infinite ease-in-out;
        }

        .circle1 {
            width: 350px;
            height: 350px;
            top: 5%;
            right: 5%;
            animation-delay: 0s;
        }

        .circle2 {
            width: 250px;
            height: 250px;
            bottom: 15%;
            left: 10%;
            animation-delay: 3s;
        }

        .circle3 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 5%;
            animation-delay: 5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(30px, -30px);
            }

            50% {
                transform: translate(-20px, 20px);
            }

            75% {
                transform: translate(20px, 10px);
            }
        }

        /* Container */
        .container {
            background: white;
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 188, 212, 0.15);
            width: 450px;
            max-width: 90%;
            border: 1px solid rgba(0, 188, 212, 0.1);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo-icon {
            display: none;
        }

        .logo img {
            height: 60px;
            width: auto;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: 2px;
        }

        .logo h1 span {
            color: var(--primary);
        }

        .logo p {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Form */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(0, 188, 212, 0.2);
            border-radius: 12px;
            font-size: 16px;
            background: var(--light-gray);
            color: var(--text-dark);
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.1);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-cyan);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 188, 212, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading */
        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Messages */
        .message {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .success {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Links */
        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .links a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: var(--text-muted);
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(0, 188, 212, 0.2);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }

        .back-home a:hover {
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="container">
        <div class="logo">
            <img src="/logo.png?v=2" alt="TAU TEC">
            <p>Welcome back!</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="********" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Login</span>
                <div class="loading" id="loading"></div>
            </button>

            <div id="message" class="message"></div>
        </form>

        <div class="divider">or</div>

        <div class="links">
            <p style="color: var(--text-muted);">Don't have an account?
                <a href="/register.html">Register now</a>
            </p>
        </div>

        <div class="back-home">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Show loading
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';
            message.style.display = 'none';

            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Save token and user info
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    // Show success message
                    message.className = 'message success';
                    message.textContent = '✓ Login successful! Redirecting...';
                    message.style.display = 'block';

                    // Redirect based on role
                    setTimeout(() => {
                        const role = data.data.user.role;
                        switch (role) {
                            case 'student':
                                window.location.href = '/student-dashboard.html';
                                break;
                            case 'instructor':
                                window.location.href = '/instructor-dashboard.html';
                                break;
                            case 'client':
                                window.location.href = '/client-dashboard.html';
                                break;
                            case 'admin':
                                window.location.href = '/admin-dashboard.html';
                                break;
                            default:
                                window.location.href = '/dashboard.html';
                        }
                    }, 1000);
                } else {
                    // Show error
                    message.className = 'message error';
                    message.textContent = '✕ ' + (data.message || 'Login failed');
                    message.style.display = 'block';

                    // Reset button
                    submitBtn.disabled = false;
                    btnText.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (error) {
                console.error('Login error:', error);
                message.className = 'message error';
                message.textContent = '✕ Server connection error';
                message.style.display = 'block';

                // Reset button
                submitBtn.disabled = false;
                btnText.style.display = 'block';
                loading.style.display = 'none';
            }
        });

        // Enter key support
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>

</html>
