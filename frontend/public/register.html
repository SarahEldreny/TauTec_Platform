<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Tau Tec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00bcd4;
            --primary-dark: #0097a7;
            --primary-light: #4dd0e1;
            --light: #ffffff;
            --light-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --gradient-cyan: linear-gradient(135deg, #00bcd4 0%, #0097a7 100%);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #e0f7fa 0%, #ffffff 50%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.2), rgba(0, 151, 167, 0.2));
            animation: float 20s infinite ease-in-out;
        }

        .circle1 {
            width: 350px;
            height: 350px;
            top: 5%;
            right: 5%;
        }

        .circle2 {
            width: 250px;
            height: 250px;
            bottom: 15%;
            left: 10%;
            animation-delay: 3s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(30px, -30px);
            }

            50% {
                transform: translate(-20px, 20px);
            }

            75% {
                transform: translate(20px, 10px);
            }
        }

        .container {
            background: white;
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 188, 212, 0.15);
            width: 500px;
            max-width: 95%;
            border: 1px solid rgba(0, 188, 212, 0.1);
            animation: slideIn 0.5s ease-out;
            max-height: 95vh;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo-icon {
            display: none;
        }

        .logo img {
            height: 60px;
            width: auto;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: 2px;
        }

        .logo h1 span {
            color: var(--primary);
        }

        .logo p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(0, 188, 212, 0.2);
            border-radius: 12px;
            font-size: 16px;
            background: var(--light-gray);
            color: var(--text-dark);
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        select {
            cursor: pointer;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.1);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: rgba(0, 188, 212, 0.1);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s;
            border-radius: 10px;
        }

        .strength-weak {
            width: 33%;
            background: #ef4444;
        }

        .strength-medium {
            width: 66%;
            background: #f59e0b;
        }

        .strength-strong {
            width: 100%;
            background: #10b981;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-cyan);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 188, 212, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .success {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .links a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: var(--text-muted);
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: rgba(0, 188, 212, 0.2);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .role-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-option {
            padding: 15px;
            background: var(--light-gray);
            border: 2px solid rgba(0, 188, 212, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .role-option:hover {
            border-color: var(--primary);
            background: rgba(0, 188, 212, 0.05);
        }

        .role-option.selected {
            border-color: var(--primary);
            background: rgba(0, 188, 212, 0.1);
        }

        .role-option .icon {
            font-size: 32px;
            margin-bottom: 8px;
            pointer-events: none;
        }

        .role-option .label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            pointer-events: none;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }

        .back-home a:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 26px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="container">
        <div class="logo">
            <img src="/logo.png?v=2" alt="TAU TEC">
            <p>Join us today</p>
        </div>

        <form id="registerForm">
            <div class="form-group full">
                <label>Choose Account Type</label>
                <div class="role-selector">
                    <div class="role-option" onclick="selectRole('student', this)">
                        <div class="icon">🎓</div>
                        <div class="label">Student</div>
                    </div>
                    <div class="role-option" onclick="selectRole('instructor', this)">
                        <div class="icon">👨‍🏫</div>
                        <div class="label">Instructor</div>
                    </div>
                </div>
                <input type="hidden" id="role" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="first_name" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="last_name" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>Phone (optional)</label>
                <input type="tel" id="phone" placeholder="01012345678">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="********" required minlength="6">
                <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" placeholder="********" required>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Create Account</span>
                <div class="loading" id="loading"></div>
            </button>

            <div id="message" class="message"></div>
        </form>

        <div class="divider">Already have an account?</div>

        <div class="links">
            <a href="/login.html">Login</a>
        </div>

        <div class="back-home">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let selectedRole = '';

        // Role selection - Direct Function
        function selectRole(role, element) {
            // Remove selected class from all options
            document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));

            // Add selected class to clicked option
            element.classList.add('selected');

            // Update state
            selectedRole = role;
            document.getElementById('role').value = role;

            console.log('Role selected:', role); // Debug
        }

        // Password strength indicator
        const passwordInput = document.getElementById('password');
        const strengthIndicator = document.getElementById('passwordStrength');
        const strengthBar = document.getElementById('strengthBar');

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            strengthIndicator.style.display = 'block';

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            strengthBar.className = 'password-strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 4) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        });

        // Form submission
        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            // Validation
            if (!selectedRole) {
                message.className = 'message error';
                message.textContent = '✕ Please select an account type';
                message.style.display = 'block';
                return;
            }

            if (password !== confirm_password) {
                message.className = 'message error';
                message.textContent = '✕ Passwords do not match';
                message.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                message.className = 'message error';
                message.textContent = '✕ Password must be at least 6 characters';
                message.style.display = 'block';
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';
            message.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        role: selectedRole,
                        first_name,
                        last_name,
                        phone
                    })
                });

                const data = await response.json();

                if (data.success) {
                    message.className = 'message success';
                    message.textContent = '✓ Account created successfully! Logging in...';
                    message.style.display = 'block';

                    // Auto login
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    // Redirect based on role
                    setTimeout(() => {
                        const userRole = data.data.user.role;
                        switch (userRole) {
                            case 'student':
                                window.location.href = '/student-dashboard.html';
                                break;
                            case 'instructor':
                                window.location.href = '/instructor-dashboard.html';
                                break;
                            default:
                                window.location.href = '/';
                        }
                    }, 1500);
                } else {
                    message.className = 'message error';
                    message.textContent = '✕ ' + (data.message || 'Error creating account');
                    message.style.display = 'block';

                    submitBtn.disabled = false;
                    btnText.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (error) {
                console.error('Registration error:', error);
                message.className = 'message error';
                message.textContent = '✕ Server connection error';
                message.style.display = 'block';

                submitBtn.disabled = false;
                btnText.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
</body>

</html>
