<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - TauTec</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.1;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.3));
            animation: float 20s infinite ease-in-out;
        }

        .circle1 {
            width: 300px;
            height: 300px;
            top: 10%;
            right: 10%;
        }

        .circle2 {
            width: 200px;
            height: 200px;
            bottom: 20%;
            left: 15%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(30px, -30px); }
            50% { transform: translate(-20px, 20px); }
            75% { transform: translate(20px, 10px); }
        }

        .container {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 500px;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.5s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .logo p {
            color: #94a3b8;
            font-size: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #f1f5f9;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(15, 23, 42, 0.5);
            color: #f1f5f9;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        select {
            cursor: pointer;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        input::placeholder {
            color: #64748b;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s;
            border-radius: 10px;
        }

        .strength-weak { width: 33%; background: #ef4444; }
        .strength-medium { width: 66%; background: #f59e0b; }
        .strength-strong { width: 100%; background: #10b981; }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #8b5cf6;
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #64748b;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .role-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-option {
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .role-option:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }

        .role-option.selected {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.2);
        }

        .role-option .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .role-option .label {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            .logo h1 {
                font-size: 28px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="container">
        <div class="logo">
            <h1>🎓 TauTec</h1>
            <p>انضم إلينا اليوم</p>
        </div>

        <form id="registerForm">
            <div class="form-group full">
                <label>اختر نوع الحساب</label>
                <div class="role-selector">
                    <div class="role-option" data-role="student">
                        <div class="icon">🎓</div>
                        <div class="label">طالب</div>
                    </div>
                    <div class="role-option" data-role="instructor">
                        <div class="icon">👨‍🏫</div>
                        <div class="label">مدرس</div>
                    </div>
                    <div class="role-option" data-role="client">
                        <div class="icon">💼</div>
                        <div class="label">عميل</div>
                    </div>
                    <div class="role-option" data-role="admin">
                        <div class="icon">⚙️</div>
                        <div class="label">مدير</div>
                    </div>
                </div>
                <input type="hidden" id="role" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>الاسم الأول</label>
                    <input 
                        type="text" 
                        id="first_name" 
                        placeholder="أحمد"
                        required
                    >
                </div>
                <div class="form-group">
                    <label>الاسم الأخير</label>
                    <input 
                        type="text" 
                        id="last_name" 
                        placeholder="محمد"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>رقم الهاتف (اختياري)</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="01012345678"
                >
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="********"
                    required
                    minlength="6"
                >
                <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    placeholder="********"
                    required
                >
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">إنشاء حساب</span>
                <div class="loading" id="loading"></div>
            </button>

            <div id="message" class="message"></div>
        </form>

        <div class="divider">لديك حساب بالفعل؟</div>

        <div class="links">
            <a href="/login.html">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let selectedRole = '';

        // Role selection
        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                selectedRole = option.dataset.role;
                document.getElementById('role').value = selectedRole;
            });
        });

        // Password strength indicator
        const passwordInput = document.getElementById('password');
        const strengthIndicator = document.getElementById('passwordStrength');
        const strengthBar = document.getElementById('strengthBar');

        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            strengthIndicator.style.display = 'block';

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            strengthBar.className = 'password-strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 4) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        });

        // Form submission
        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            // Validation
            if (!selectedRole) {
                message.className = 'message error';
                message.textContent = '✕ الرجاء اختيار نوع الحساب';
                message.style.display = 'block';
                return;
            }

            if (password !== confirm_password) {
                message.className = 'message error';
                message.textContent = '✕ كلمات المرور غير متطابقة';
                message.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                message.className = 'message error';
                message.textContent = '✕ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                message.style.display = 'block';
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';
            message.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        role: selectedRole,
                        first_name,
                        last_name,
                        phone
                    })
                });

                const data = await response.json();

                if (data.success) {
                    message.className = 'message success';
                    message.textContent = '✓ تم إنشاء الحساب بنجاح! جاري تسجيل الدخول...';
                    message.style.display = 'block';

                    // Auto login
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.data.userId,
                        email,
                        role: selectedRole,
                        first_name,
                        last_name
                    }));

                    // Redirect based on role
                    setTimeout(() => {
                        switch(selectedRole) {
                            case 'student':
                                window.location.href = '/student-dashboard.html';
                                break;
                            case 'instructor':
                                window.location.href = '/instructor-dashboard.html';
                                break;
                            case 'client':
                                window.location.href = '/client-dashboard.html';
                                break;
                            case 'admin':
                                window.location.href = '/admin-dashboard.html';
                                break;
                            default:
                                window.location.href = '/';
                        }
                    }, 1500);
                } else {
                    message.className = 'message error';
                    message.textContent = '✕ ' + (data.message || 'حدث خطأ في إنشاء الحساب');
                    message.style.display = 'block';
                    
                    submitBtn.disabled = false;
                    btnText.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (error) {
                console.error('Registration error:', error);
                message.className = 'message error';
                message.textContent = '✕ حدث خطأ في الاتصال بالخادم';
                message.style.display = 'block';

                submitBtn.disabled = false;
                btnText.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
