<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - TauTec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); }
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; }
        header .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        main { max-width: 900px; margin: 24px auto; padding: 0 20px 40px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); }
        .btn { border: none; border-radius: 10px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-danger { background: #fee2e2; color: #991b1b; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .meta { color: var(--muted); font-size: 13px; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .list { display: grid; gap: 12px; margin-top: 12px; }
        .item { border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
        .item.unread { background: #ecfeff; border-color: #a5f3fc; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .badge.unread { background: #fef3c7; color: #92400e; }
        .badge.read { background: #dcfce7; color: #166534; }
        .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
    </style>
</head>
<body>
    <header>
        <div class="row">
            <div>
                <div style="font-size: 18px; font-weight: 800;">Notifications</div>
                <div class="meta" id="subtitle">Loading...</div>
            </div>
            <div class="toolbar">
                <button class="btn btn-secondary" onclick="markAllRead()">Mark all read</button>
                <button class="btn btn-danger" onclick="deleteAllRead()">Delete read</button>
                <button class="btn btn-outline" onclick="goBack()">Back</button>
            </div>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="toolbar" style="margin-bottom: 10px;">
                <button class="btn btn-secondary" onclick="setFilter('all')">All</button>
                <button class="btn btn-secondary" onclick="setFilter('unread')">Unread</button>
                <button class="btn btn-secondary" onclick="setFilter('read')">Read</button>
                <button class="btn btn-primary" onclick="loadNotifications()">Refresh</button>
            </div>
            <div id="list" class="list">
                <div class="empty">Loading notifications...</div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) window.location.href = '/login.html';

        let notifications = [];
        let filter = 'all';

        function goBack() {
            if (user.role === 'instructor' || user.role === 'admin') {
                window.location.href = '/instructor-dashboard.html';
            } else {
                window.location.href = '/student-dashboard.html';
            }
        }

        function setFilter(value) {
            filter = value;
            render();
        }

        async function loadNotifications() {
            try {
                const res = await fetch(`${API_URL}/notifications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                notifications = data.data || [];
                updateSubtitle();
                render();
            } catch (e) {
                document.getElementById('list').innerHTML = '<div class="empty">Failed to load notifications.</div>';
            }
        }

        async function updateSubtitle() {
            try {
                const res = await fetch(`${API_URL}/notifications/unread-count`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const count = data?.data?.unreadCount || 0;
                document.getElementById('subtitle').textContent = `${count} unread notifications`;
            } catch {
                document.getElementById('subtitle').textContent = 'Notifications';
            }
        }

        function render() {
            const list = document.getElementById('list');
            let items = notifications;
            if (filter === 'unread') items = notifications.filter(n => !n.is_read);
            if (filter === 'read') items = notifications.filter(n => n.is_read);

            if (!items.length) {
                list.innerHTML = '<div class="empty">No notifications found.</div>';
                return;
            }

            list.innerHTML = items.map(n => `
                <div class="item ${n.is_read ? '' : 'unread'}">
                    <div style="display:flex; align-items:center; justify-content:space-between; gap: 12px;">
                        <div style="font-weight:700;">${n.title || 'Notification'}</div>
                        <span class="badge ${n.is_read ? 'read' : 'unread'}">${n.is_read ? 'READ' : 'UNREAD'}</span>
                    </div>
                    <div class="meta">${n.message || n.content || ''}</div>
                    <div class="meta">${n.created_at ? new Date(n.created_at).toLocaleString() : ''}</div>
                    <div class="toolbar">
                        ${n.link ? `<a class="btn btn-outline" href="${n.link}">Open</a>` : ''}
                        ${n.is_read ? '' : `<button class="btn btn-secondary" onclick="markRead(${n.id})">Mark read</button>`}
                        <button class="btn btn-danger" onclick="deleteOne(${n.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function markRead(id) {
            try {
                await fetch(`${API_URL}/notifications/${id}/read`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadNotifications();
            } catch {}
        }

        async function markAllRead() {
            try {
                await fetch(`${API_URL}/notifications/read-all`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadNotifications();
            } catch {}
        }

        async function deleteOne(id) {
            if (!confirm('Delete this notification?')) return;
            try {
                await fetch(`${API_URL}/notifications/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadNotifications();
            } catch {}
        }

        async function deleteAllRead() {
            if (!confirm('Delete all read notifications?')) return;
            try {
                await fetch(`${API_URL}/notifications/read/all`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadNotifications();
            } catch {}
        }

        loadNotifications();
    </script>
</body>
</html>
