<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم العميل - TauTec</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --dark: #0f172a;
            --dark-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--text);
        }
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 280px;
            background: var(--dark-card);
            padding: 30px 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 40px;
        }
        .user-info {
            background: rgba(99, 102, 241, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 10px;
        }
        .main-content {
            margin-right: 280px;
            padding: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--dark-card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-value {
            font-size: 32px;
            font-weight: 900;
        }
        .btn-primary {
            padding: 12px 24px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">🎓 TauTec</div>
        <div class="user-info">
            <div class="user-avatar">💼</div>
            <div id="userName">العميل</div>
        </div>
    </aside>

    <main class="main-content">
        <h1>مرحباً بك! 👋</h1>
        <section class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalProjects">0</div>
                <div>إجمالي المشاريع</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedProjects">0</div>
                <div>مشاريع مكتملة</div>
            </div>
        </section>
        <button class="btn-primary" onclick="createProject()">+ مشروع جديد</button>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token || user.role !== 'client') {
            window.location.href = '/login.html';
        }

        document.getElementById('userName').textContent = user.first_name;

        async function loadStats() {
            const res = await fetch(`${API_URL}/client/dashboard/stats`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('totalProjects').textContent = data.data.totalProjects;
                document.getElementById('completedProjects').textContent = 
                    data.data.projectsByStatus.completed || 0;
            }
        }

        function createProject() {
            alert('سيتم فتح نموذج إنشاء مشروع جديد');
        }

        loadStats();
    </script>
</body>
</html>
