<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدرس - TauTec</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --dark-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 280px;
            background: var(--dark-card);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            z-index: 100;
            overflow-y: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            text-align: center;
        }

        .user-info {
            background: rgba(99, 102, 241, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 10px;
        }

        .user-name {
            text-align: center;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .user-role {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: var(--text);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .main-content {
            margin-right: 280px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--dark-card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.2);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stat-icon.blue { background: rgba(99, 102, 241, 0.2); color: #6366f1; }
        .stat-icon.green { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .stat-icon.orange { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .stat-icon.purple { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-container {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: right;
            padding: 15px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-danger { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); }
            .main-content { margin-right: 0; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">🎓 TauTec</div>
        
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">👨‍🏫</div>
            <div class="user-name" id="userName">جاري التحميل...</div>
            <div class="user-role">مدرس</div>
        </div>

        <nav>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <span>📊</span> الرئيسية
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#courses" class="nav-link">
                        <span>📚</span> دوراتي
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#students" class="nav-link">
                        <span>👥</span> الطلاب
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#grading" class="nav-link">
                        <span>📝</span> التقييم
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#analytics" class="nav-link">
                        <span>📈</span> التحليلات
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" onclick="logout()">
                        <span>🚪</span> تسجيل الخروج
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>مرحباً، <span id="headerName">المدرس</span>! 👋</h1>
            <button class="btn btn-primary" onclick="window.location.href='/create-course.html'">
                + إنشاء دورة جديدة
            </button>
        </header>

        <section class="stats-grid" id="statsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل الإحصائيات...</p>
            </div>
        </section>

        <section>
            <div class="section-title">
                <span>الواجبات المعلقة للتقييم</span>
                <a href="#grading" class="btn btn-primary" style="padding: 8px 16px; font-size: 14px;">
                    عرض الكل
                </a>
            </div>
            <div class="table-container" id="submissionsTable">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>جاري التحميل...</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token || user.role !== 'instructor') {
            window.location.href = '/login.html';
        }

        document.getElementById('userName').textContent = `${user.first_name} ${user.last_name}`;
        document.getElementById('headerName').textContent = user.first_name;
        document.getElementById('userAvatar').textContent = user.first_name.charAt(0);

        async function fetchStats() {
            try {
                const response = await fetch(`${API_URL}/instructor/dashboard/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (data.success) {
                    const stats = data.data;
                    document.getElementById('statsGrid').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-icon blue">📚</div>
                            <div class="stat-value">${stats.totalCourses}</div>
                            <div class="stat-label">إجمالي الدورات</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green">✅</div>
                            <div class="stat-value">${stats.publishedCourses}</div>
                            <div class="stat-label">دورات منشورة</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon orange">👥</div>
                            <div class="stat-value">${stats.totalStudents}</div>
                            <div class="stat-label">إجمالي الطلاب</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon purple">📝</div>
                            <div class="stat-value">${stats.pendingGrading}</div>
                            <div class="stat-label">معلق للتقييم</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Fetch stats error:', error);
            }
        }

        async function fetchSubmissions() {
            try {
                const response = await fetch(`${API_URL}/instructor/submissions?status=submitted`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    document.getElementById('submissionsTable').innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>الطالب</th>
                                    <th>الواجب</th>
                                    <th>الدورة</th>
                                    <th>تاريخ التسليم</th>
                                    <th>الحالة</th>
                                    <th>الإجراء</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.data.slice(0, 5).map(s => `
                                    <tr>
                                        <td>${s.first_name} ${s.last_name}</td>
                                        <td>${s.assignment_title}</td>
                                        <td>${s.course_title}</td>
                                        <td>${new Date(s.submitted_at).toLocaleDateString('ar-EG')}</td>
                                        <td><span class="badge badge-warning">معلق</span></td>
                                        <td>
                                            <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="gradeSubmission(${s.id})">
                                                تقييم
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    document.getElementById('submissionsTable').innerHTML = `
                        <p style="text-align: center; color: var(--text-muted); padding: 40px;">
                            لا توجد واجبات معلقة للتقييم
                        </p>
                    `;
                }
            } catch (error) {
                console.error('Fetch submissions error:', error);
            }
        }

        function gradeSubmission(id) {
            alert('سيتم فتح صفحة التقييم للواجب #' + id);
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        fetchStats();
        fetchSubmissions();
    </script>
</body>
</html>
