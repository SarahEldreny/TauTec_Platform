<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assignment - TauTec Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.secondary:hover {
            background-color: #545b62;
        }
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .alert.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <nav style="background-color: #007bff; padding: 15px; color: white; margin-bottom: 20px;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0;">TauTec Platform</h2>
            <div>
                <a href="instructor-dashboard.html" style="color: white; margin-right: 15px; text-decoration: none;">Dashboard</a>
                <a href="login.html" style="color: white; text-decoration: none;">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Create New Assignment</h1>
        
        <div id="alert-container"></div>

        <form id="assignmentForm">
            <div class="form-group">
                <label for="course_id">Course *</label>
                <select id="course_id" name="course_id" required>
                    <option value="">-- Select a Course --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="title">Assignment Title *</label>
                <input type="text" id="title" name="title" placeholder="e.g., Midterm Exam" required>
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" placeholder="Provide detailed instructions for the assignment..." required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="due_date">Due Date *</label>
                    <input type="datetime-local" id="due_date" name="due_date" required>
                </div>

                <div class="form-group">
                    <label for="max_score">Maximum Score *</label>
                    <input type="number" id="max_score" name="max_score" min="0" step="0.1" placeholder="100" required>
                </div>
            </div>

            <div>
                <button type="submit">Create Assignment</button>
                <button type="button" class="secondary" onclick="window.history.back()">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // Load instructor's courses
        async function loadCourses() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/courses/instructor/my-courses`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load courses');

                const data = await response.json();
                const courseSelect = document.getElementById('course_id');
                
                if (data.data && data.data.length > 0) {
                    data.data.forEach(course => {
                        const option = document.createElement('option');
                        option.value = course.id;
                        option.textContent = `${course.title} (${course.status})`;
                        courseSelect.appendChild(option);
                    });
                } else {
                    showAlert('No courses found. Please create a course first.', 'error');
                }
            } catch (error) {
                console.error('Error loading courses:', error);
                showAlert('Error loading courses: ' + error.message, 'error');
            }
        }

        // Handle form submission
        document.getElementById('assignmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                course_id: parseInt(document.getElementById('course_id').value),
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                due_date: document.getElementById('due_date').value,
                max_score: parseFloat(document.getElementById('max_score').value)
            };

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/assignments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Assignment created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'instructor-dashboard.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Failed to create assignment', 'error');
                }
            } catch (error) {
                console.error('Error creating assignment:', error);
                showAlert('Error: ' + error.message, 'error');
            }
        });

        // Show alert message
        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert ${type}`;
            alertDiv.textContent = message;
            container.innerHTML = '';
            container.appendChild(alertDiv);

            if (type === 'success') {
                setTimeout(() => alertDiv.remove(), 3000);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadCourses);
    </script>
</body>
</html>
