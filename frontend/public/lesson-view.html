<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Content - TauTec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --primary-light: #ecfeff;
            --gradient-primary: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        .header {
            background: var(--gradient-primary);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
        }

        .header-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .header-links a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .breadcrumb {
            margin-bottom: 16px;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            box-shadow: var(--shadow-md);
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .meta {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .section h3 {
            margin-bottom: 8px;
            font-size: 16px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            background: var(--gradient-primary);
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary {
            background: var(--bg-body);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .content-box {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            white-space: pre-wrap;
        }

        .materials-list {
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .materials-list a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #fca5a5;
            background: #fee2e2;
            color: #991b1b;
            margin-top: 12px;
        }

        .loading {
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>TauTec Learning</h1>
        <div class="header-links">
            <a href="/student-dashboard.html">Dashboard</a>
        </div>
    </header>

    <main class="container">
        <div class="breadcrumb">
            <a id="backLink" href="/course-view.html">Back to Course</a>
        </div>

        <div class="card">
            <div id="lessonTitle" class="title">Lesson</div>
            <div id="lessonMeta" class="meta">Loading...</div>

            <div id="lessonError" class="alert" style="display:none;"></div>

            <div class="section" id="videoSection" style="display:none;">
                <h3>Video</h3>
                <a id="videoLink" class="btn" href="#" target="_blank" rel="noreferrer">Open Video</a>
            </div>

            <div class="section" id="contentSection" style="display:none;">
                <h3>Lesson Content</h3>
                <div id="lessonContent" class="content-box"></div>
            </div>

            <div class="section" id="materialsSection" style="display:none;">
                <h3>Materials</h3>
                <ul id="materialsList" class="materials-list"></ul>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const params = new URLSearchParams(window.location.search);
        const lessonId = params.get('lessonId');
        const courseId = params.get('courseId');
        const token = localStorage.getItem('token');

        const backLink = document.getElementById('backLink');
        if (courseId) {
            backLink.href = `/course-view.html?id=${courseId}`;
        }

        const lessonTitle = document.getElementById('lessonTitle');
        const lessonMeta = document.getElementById('lessonMeta');
        const lessonError = document.getElementById('lessonError');
        const videoSection = document.getElementById('videoSection');
        const videoLink = document.getElementById('videoLink');
        const contentSection = document.getElementById('contentSection');
        const lessonContent = document.getElementById('lessonContent');
        const materialsSection = document.getElementById('materialsSection');
        const materialsList = document.getElementById('materialsList');

        function showError(message) {
            lessonError.textContent = message;
            lessonError.style.display = 'block';
        }

        function resolveFileUrl(filePath) {
            if (!filePath) return '#';
            if (filePath.startsWith('http://') || filePath.startsWith('https://')) return filePath;
            const base = API_URL.replace('/api', '');
            return filePath.startsWith('/') ? `${base}${filePath}` : `${base}/${filePath}`;
        }

        async function loadLesson() {
            if (!lessonId) {
                showError('Missing lesson id.');
                lessonMeta.textContent = '';
                return;
            }
            try {
                const res = await fetch(`${API_URL}/student/lessons/${lessonId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401 || res.status === 403) {
                    showError('You do not have access to this lesson.');
                    lessonMeta.textContent = '';
                    return;
                }
                const data = await res.json();
                if (!data.success) {
                    showError(data.message || 'Failed to load lesson.');
                    lessonMeta.textContent = '';
                    return;
                }

                const lesson = data.data.lesson;
                const materials = data.data.materials || [];

                lessonTitle.textContent = lesson.title || 'Lesson';
                lessonMeta.textContent = `Type: ${lesson.lesson_type || 'lesson'} | Duration: ${lesson.duration || 0} min`;

                if (lesson.video_url) {
                    videoSection.style.display = 'block';
                    videoLink.href = lesson.video_url;
                }

                if (lesson.content && lesson.content.trim()) {
                    contentSection.style.display = 'block';
                    const content = lesson.content.trim();
                    if (/^https?:\/\//i.test(content)) {
                        lessonContent.innerHTML = `<a href="${content}" target="_blank" rel="noreferrer">${content}</a>`;
                    } else {
                        lessonContent.textContent = content;
                    }
                }

                if (materials.length > 0) {
                    materialsSection.style.display = 'block';
                    materialsList.innerHTML = materials.map(item => {
                        const href = resolveFileUrl(item.file_path);
                        const meta = item.file_type ? ` (${item.file_type})` : '';
                        return `<li><a href="${href}" target="_blank" rel="noreferrer">${item.title || item.file_name}${meta}</a></li>`;
                    }).join('');
                }
            } catch (error) {
                console.error('Load lesson error:', error);
                showError('Failed to load lesson.');
                lessonMeta.textContent = '';
            }
        }

        loadLesson();
    </script>
</body>
</html>
